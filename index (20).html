<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha Oftalmológica Veterinária - HVA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ===================== HELPERS ===================== */

function interpretSchirmer(v) {
  if (!v || isNaN(Number(v))) return "";
  return Number(v) < 15 ? "Baixa produção lacrimal" : "Normal";
}
function interpretPio(v) {
  if (!v || isNaN(Number(v))) return "";
  if (Number(v) < 11) return "Hipotonia";
  if (Number(v) > 25) return "Hipertensão ocular";
  return "Normal";
}

/* ===================== GRAVAÇÃO DA CONSULTA (Gemini via backend) ===================== */

const CFG_KEY = "hva_gemini_cfg_v2";
const MODELO_PADRAO = "gemini-3.8-flash";
const RASCUNHO_KEY = "hva_gemini_rascunho_v1";
const SEGMENTO_MS = 5 * 60 * 1000;

const PROMPT_TRANSCRICAO = `Transcreva fielmente, em português do Brasil, esta conversa de uma consulta de oftalmologia veterinária entre o veterinário e o tutor do animal.

Regras:
- Identifique quem fala como "Veterinário:" e "Tutor:" (use "Outro:" se houver mais alguém).
- Não resuma, não corrija o conteúdo e não invente nada. Transcreva só o que foi dito.
- Escreva com atenção termos oftalmológicos, nomes de medicamentos, concentrações e doses.
- Se algo estiver inaudível, escreva [inaudível].
- Se não houver nenhuma fala no áudio, responda exatamente: [silêncio]`;

const REGRAS_RESUMO = `Você organiza a transcrição de uma consulta de oftalmologia veterinária para o veterinário responsável.

REGRAS OBRIGATÓRIAS (valem mesmo que as instruções do veterinário digam outra coisa):
- Use SOMENTE o que aparece na transcrição. Nunca invente achados, diagnósticos, medicamentos, doses ou prazos.
- Se uma informação não foi dita, deixe o campo correspondente vazio (string vazia) ou omita o tópico.
- "queixa_principal": o motivo da consulta e o histórico relatado pelo tutor, em 1 a 3 frases objetivas.
- "diagnostico": apenas o diagnóstico (ou suspeita) que o VETERINÁRIO afirmou explicitamente. Se não houve, deixe vazio.
- "resumo": o resumo da consulta, seguindo as instruções do veterinário abaixo. Pode usar quebras de linha e marcadores simples com "-".
- "topicos": a conversa organizada em tópicos curtos, com itens objetivos. Inclua, quando houver conteúdo: "Queixa e histórico", "Achados do exame", "Diagnóstico", "Tratamento e prescrição", "Orientações ao tutor", "Pontos para lembrar no retorno" e "Outros assuntos da conversa".
- Escreva em português do Brasil.

Responda SOMENTE com um JSON válido, sem texto antes ou depois e sem blocos de código, neste formato:
{"queixa_principal": "", "diagnostico": "", "resumo": "", "topicos": [{"titulo": "", "itens": [""]}]}`;

function blobParaBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onloadend = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = () => reject(new Error("Não consegui ler o áudio."));
    r.readAsDataURL(blob);
  });
}

function mimeSeguro(m) {
  m = String(m || "").split(";")[0].trim().toLowerCase();
  if (m === "audio/mp4" || m === "video/mp4" || m === "audio/x-m4a") return "audio/m4a";
  if (m === "audio/mpeg") return "audio/mp3";
  return m || "audio/webm";
}

const PROMPT_PADRAO = "Faça um resumo objetivo da consulta, destacando queixa, achados, diagnóstico, tratamento e orientações dadas ao tutor, além de qualquer assunto que valha lembrar no retorno.";

function lerLS(chave, padrao) {
  try { const v = localStorage.getItem(chave); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; }
}
function gravarLS(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) {}
}
function fmtTempo(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}

function ConfigGemini({ aberto, onFechar, cfg, onSalvar }) {
  const [chave, setChave] = useState("");
  const [modelo, setModelo] = useState("");
  const [prompt, setPrompt] = useState("");
  useEffect(() => {
    if (aberto) { setChave(cfg.chave || ""); setModelo(cfg.modelo || ""); setPrompt(cfg.prompt || PROMPT_PADRAO); }
  }, [aberto]);
  if (!aberto) return null;
  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl p-5 w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <h3 className="font-bold text-lg mb-3">⚙️ Configurar gravação</h3>
        <label className="block text-sm font-semibold mb-1">Chave de API do Google (Gemini)</label>
        <input type="password" autoComplete="off" className="w-full border rounded-lg px-3 py-2 mb-1 text-sm" placeholder="Cole aqui a chave copiada do AI Studio" value={chave} onChange={e => setChave(e.target.value)} />
        <p className="text-xs text-gray-500 mb-3">A chave fica salva só neste navegador e nunca vai para o arquivo do aplicativo.</p>
        <label className="block text-sm font-semibold mb-1">Seu prompt para o resumo</label>
        <textarea className="w-full border rounded-lg px-3 py-2 mb-1 text-sm" rows={9} value={prompt} onChange={e => setPrompt(e.target.value)} />
        <p className="text-xs text-gray-500 mb-3">Cole aqui o prompt que você já usa no NotebookLM. A resposta sempre virá organizada em queixa, diagnóstico, resumo e tópicos.</p>
        <label className="block text-sm font-semibold mb-1">Modelo (avançado)</label>
        <input className="w-full border rounded-lg px-3 py-2 mb-3 text-sm" placeholder={MODELO_PADRAO} value={modelo} onChange={e => setModelo(e.target.value)} />
        <div className="flex justify-end gap-2">
          <button className="px-4 py-2 rounded-lg bg-gray-200 text-sm" onClick={onFechar}>Cancelar</button>
          <button className="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm" onClick={() => { onSalvar({ chave: chave.trim(), modelo: modelo.trim(), prompt: prompt.trim() || PROMPT_PADRAO }); onFechar(); }}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

function GravadorConsulta({ patient, consulta, setConsulta, chiefComplaint, diagnostico, onQueixa, onDiagnostico, onGravando, permitirRascunho }) {
  const [cfg, setCfg] = useState(() => lerLS(CFG_KEY, { chave: "", modelo: "", prompt: PROMPT_PADRAO }));
  const [cfgAberto, setCfgAberto] = useState(false);
  const [gravando, setGravando] = useState(false);
  const [segundos, setSegundos] = useState(0);
  const [status, setStatus] = useState("");
  const [erro, setErro] = useState("");
  const [ocupado, setOcupado] = useState(false);
  const [pendentes, setPendentes] = useState(0);
  const [falhas, setFalhas] = useState([]); // blobs que falharam
  const [transcricao, setTranscricao] = useState(() => (consulta && consulta.transcricao) || (permitirRascunho ? lerLS(RASCUNHO_KEY, "") : ""));

  const streamRef = useRef(null);
  const recRef = useRef(null);
  const gravandoRef = useRef(false);
  const timerSegRef = useRef(null);
  const timerRelRef = useRef(null);
  const wakeRef = useRef(null);
  const mimeRef = useRef("");
  const fila = useRef(Promise.resolve());
  const partes = useRef([]); // {idx, texto}
  const contador = useRef(0);
  const transcricaoRef = useRef(transcricao);
  transcricaoRef.current = transcricao;

  useEffect(() => { gravarLS(RASCUNHO_KEY, consulta ? "" : transcricao); }, [transcricao, consulta]);
  useEffect(() => { if (onGravando) onGravando(gravando); }, [gravando]);
  useEffect(() => () => pararTudo(), []);

  function salvarCfg(c) { setCfg(c); gravarLS(CFG_KEY, c); }
  const configurado = !!cfg.chave;

  async function gemini(parts, temperatura) {
    const modelo = cfg.modelo || MODELO_PADRAO;
    let resp;
    try {
      resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelo)}:generateContent`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": cfg.chave },
        body: JSON.stringify({ contents: [{ parts }], generationConfig: { temperature: temperatura } }),
      });
    } catch (e) {
      throw new Error("sem conexão com o Google. Verifique a internet.");
    }
    let json = null;
    try { json = await resp.json(); } catch (e) {}
    if (!resp.ok) {
      const msg = (json && json.error && json.error.message) || `erro ${resp.status}`;
      if (resp.status === 400 && /API key/i.test(msg)) throw new Error("chave de API inválida. Confira em ⚙️ Configurar.");
      if (resp.status === 403) throw new Error("a chave não tem permissão ou está bloqueada: " + String(msg).slice(0, 140));
      if (resp.status === 404) throw new Error(`o modelo "${modelo}" não existe. Troque em ⚙️ Configurar > Modelo.`);
      if (resp.status === 429) throw new Error("limite de uso do Google atingido. Aguarde um pouco ou ative o faturamento.");
      throw new Error(String(msg).slice(0, 200));
    }
    const partes = (json && json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts) || [];
    const texto = partes.map(p => p.text || "").join("").trim();
    if (!texto) throw new Error("o Gemini não devolveu texto (conteúdo possivelmente bloqueado).");
    return texto;
  }

  async function transcreverBlob(blob) {
    const dados = await blobParaBase64(blob);
    let t = await gemini([{ text: PROMPT_TRANSCRICAO }, { inline_data: { mime_type: mimeSeguro(blob.type || mimeRef.current), data: dados } }], 0);
    if (/^\[sil[eê]ncio\]$/i.test(t)) t = "";
    return t;
  }

  async function enviarSegmento(blob, idx) {
    let ultimo = null;
    for (let t = 0; t < 3; t++) {
      try {
        const texto = await transcreverBlob(blob);
        partes.current.push({ idx, texto });
        partes.current.sort((a, b) => a.idx - b.idx);
        setTranscricao(partes.current.map(p => p.texto).filter(Boolean).join("\n\n"));
        return true;
      } catch (e) {
        ultimo = e;
        await new Promise(r => setTimeout(r, 1500 * (t + 1)));
      }
    }
    setErro(`Um trecho do áudio não foi transcrito: ${ultimo && ultimo.message}. Use "Tentar de novo".`);
    setFalhas(f => [...f, { blob, idx }]);
    return false;
  }

  function enfileirar(blob, idxFixo) {
    if (!blob || blob.size < 1500) return; // descarta fragmento vazio
    const idx = idxFixo !== undefined ? idxFixo : contador.current++;
    setPendentes(p => p + 1);
    fila.current = fila.current.then(() => enviarSegmento(blob, idx)).finally(() => setPendentes(p => p - 1));
  }

  async function tentarDeNovo() {
    const lista = falhas;
    setFalhas([]); setErro("");
    lista.forEach(f => enfileirar(f.blob, f.idx));
  }

  function iniciarSegmento() {
    const stream = streamRef.current;
    if (!stream) return;
    const opcoes = { audioBitsPerSecond: 24000 };
    if (mimeRef.current) opcoes.mimeType = mimeRef.current;
    const rec = new MediaRecorder(stream, opcoes);
    const pedacos = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) pedacos.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(pedacos, { type: mimeRef.current || rec.mimeType || "audio/webm" });
      enfileirar(blob);
      if (gravandoRef.current) iniciarSegmento();
    };
    rec.start(1000);
    recRef.current = rec;
    clearTimeout(timerSegRef.current);
    timerSegRef.current = setTimeout(() => { try { rec.state !== "inactive" && rec.stop(); } catch (e) {} }, SEGMENTO_MS);
  }

  async function iniciar() {
    setErro("");
    if (!configurado) { setCfgAberto(true); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { setErro("Este navegador não permite gravar áudio."); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: true, autoGainControl: true } });
      streamRef.current = stream;
    } catch (e) { setErro("Não consegui acessar o microfone. Permita o uso do microfone no navegador."); return; }
    const preferidos = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
    mimeRef.current = preferidos.find(m => MediaRecorder.isTypeSupported(m)) || "";
    partes.current = []; contador.current = 0; setFalhas([]); setTranscricao(""); setSegundos(0);
    gravandoRef.current = true; setGravando(true);
    setConsulta(null);
    setStatus("Gravando… mantenha a tela ligada e esta aba aberta.");
    try { if (navigator.wakeLock) wakeRef.current = await navigator.wakeLock.request("screen"); } catch (e) {}
    iniciarSegmento();
    timerRelRef.current = setInterval(() => setSegundos(s => s + 1), 1000);
  }

  function pararTudo() {
    gravandoRef.current = false;
    clearTimeout(timerSegRef.current);
    clearInterval(timerRelRef.current);
    try { recRef.current && recRef.current.state !== "inactive" && recRef.current.stop(); } catch (e) {}
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    try { wakeRef.current && wakeRef.current.release(); } catch (e) {}
    wakeRef.current = null;
  }

  async function pararEResumir() {
    pararTudo();
    setGravando(false);
    setStatus("Finalizando a transcrição…");
    await new Promise(r => setTimeout(r, 400)); // deixa o onstop enfileirar o último trecho
    await fila.current;
    if (!transcricaoRef.current.trim()) {
      setStatus("");
      setErro("Nenhum texto foi transcrito. Verifique a chave em ⚙️ Configurar e tente de novo.");
      return;
    }
    await resumir();
  }

  async function resumir() {
    setErro(""); setOcupado(true); setStatus("Gerando o resumo…");
    try {
      const ctx = [patient.especie && `Espécie: ${patient.especie}`, patient.idade && `Idade: ${patient.idade}`, patient.sexo && `Sexo: ${patient.sexo}`].filter(Boolean).join(" | ");
      const pedido = `${REGRAS_RESUMO}

INSTRUÇÕES DO VETERINÁRIO PARA O RESUMO:
${cfg.prompt || PROMPT_PADRAO}

${ctx ? `DADOS DO PACIENTE: ${ctx}\n\n` : ""}TRANSCRIÇÃO DA CONSULTA:
${transcricaoRef.current}`;
      const bruto = await gemini([{ text: pedido }], 0.2);
      let r;
      try {
        const limpo = bruto.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
        r = JSON.parse(limpo);
      } catch (e) {
        r = { queixa_principal: "", diagnostico: "", resumo: bruto, topicos: [] };
      }
      r.topicos = Array.isArray(r.topicos) ? r.topicos.filter(t => t && t.titulo).map(t => ({ titulo: String(t.titulo), itens: Array.isArray(t.itens) ? t.itens.map(String) : [] })) : [];
      const novo = {
        resumo: String(r.resumo || ""),
        topicos: r.topicos || [],
        transcricao: transcricaoRef.current,
        queixa: String(r.queixa_principal || ""),
        diagnostico: String(r.diagnostico || ""),
        geradoEm: new Date().toLocaleString("pt-BR"),
      };
      setConsulta(novo);
      if (novo.queixa && !chiefComplaint.trim()) onQueixa(novo.queixa, true);
      if (novo.diagnostico && !diagnostico.trim()) onDiagnostico(novo.diagnostico, true);
      setStatus("Pronto. Revise o resumo, a queixa e o diagnóstico antes de usar.");
    } catch (e) {
      setStatus("");
      setErro(`Não foi possível gerar o resumo: ${e.message}. A transcrição está guardada; use "Gerar resumo" para tentar de novo.`);
    } finally { setOcupado(false); }
  }

  async function enviarArquivo(e) {
    const arq = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!arq) return;
    if (arq.size > 18 * 1024 * 1024) { setErro("Este arquivo é grande demais (limite de 18 MB). Use a gravação pelo aplicativo, que divide a consulta em trechos."); return; }
    setErro(""); setConsulta(null); setOcupado(true); setStatus("Transcrevendo o arquivo de áudio…");
    try {
      const t = await transcreverBlob(arq);
      if (!t) throw new Error("não encontrei fala no áudio.");
      setTranscricao(t); transcricaoRef.current = t;
    } catch (err) {
      setOcupado(false); setStatus("");
      setErro(`Não foi possível transcrever o arquivo: ${err.message}`);
      return;
    }
    setOcupado(false);
    await resumir();
  }

  function editarResumo(v) { setConsulta(c => ({ ...(c || { topicos: [] }), resumo: v })); }

  const ocupadoGeral = ocupado || pendentes > 0;

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-3">
        {!gravando ? (
          <button disabled={ocupadoGeral} className="px-4 py-2 rounded-xl bg-red-600 text-white font-semibold text-sm disabled:opacity-50" onClick={iniciar}>🎙️ Iniciar gravação</button>
        ) : (
          <button className="px-4 py-2 rounded-xl bg-gray-800 text-white font-semibold text-sm" onClick={pararEResumir}>⏹️ Parar e gerar resumo</button>
        )}
        {gravando && <span className="text-red-600 font-mono text-sm animate-pulse">● {fmtTempo(segundos)}</span>}
        <label className={`px-3 py-2 rounded-xl bg-gray-100 border text-sm cursor-pointer ${gravando || ocupadoGeral ? "opacity-50 pointer-events-none" : ""}`}>
          📁 Enviar áudio
          <input type="file" accept="audio/*" className="hidden" onChange={enviarArquivo} />
        </label>
        <button disabled={gravando} className="px-3 py-2 rounded-xl bg-gray-100 border text-sm disabled:opacity-50" onClick={() => setCfgAberto(true)}>⚙️ Configurar</button>
      </div>

      {!configurado && <p className="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2 mb-2">Primeiro toque em ⚙️ Configurar, cole a chave de API do Google e o seu prompt.</p>}
      <p className="text-xs text-gray-500 mb-2">Avise o tutor que a consulta está sendo gravada. O áudio não é guardado pelo aplicativo: é enviado ao Google para transcrição e descartado.</p>

      {status && <p className="text-sm text-blue-800 mb-2">{status}{pendentes > 0 ? ` (transcrevendo ${pendentes} trecho${pendentes > 1 ? "s" : ""}…)` : ""}</p>}
      {erro && <p className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-2 mb-2">{erro}</p>}
      {falhas.length > 0 && !gravando && <button className="px-3 py-2 rounded-xl bg-amber-500 text-white text-sm mb-2" onClick={tentarDeNovo}>🔁 Tentar de novo ({falhas.length} trecho{falhas.length > 1 ? "s" : ""})</button>}

      {!gravando && transcricao.trim() && !consulta && !ocupadoGeral && (
        <button className="px-3 py-2 rounded-xl bg-blue-600 text-white text-sm mb-2" onClick={resumir}>✨ Gerar resumo</button>
      )}

      {consulta && (
        <div className="mt-3 space-y-3">
          <div>
            <div className="flex items-center justify-between mb-1">
              <h4 className="font-semibold text-sm">Resumo da consulta <span className="text-xs font-normal text-gray-500">({consulta.geradoEm})</span></h4>
              <button disabled={ocupadoGeral} className="text-xs underline text-blue-700" onClick={resumir}>refazer resumo</button>
            </div>
            <textarea className="w-full border rounded-lg px-3 py-2 text-sm" rows={5} value={consulta.resumo || ""} onChange={e => editarResumo(e.target.value)} />
          </div>

          {(consulta.queixa || consulta.diagnostico) && (
            <div className="grid md:grid-cols-2 gap-2">
              {consulta.queixa && (
                <div className="border rounded-lg p-2 bg-blue-50">
                  <div className="text-xs font-semibold mb-1">Queixa identificada</div>
                  <p className="text-sm whitespace-pre-wrap mb-1">{consulta.queixa}</p>
                  <button className="text-xs underline text-blue-700" onClick={() => onQueixa(consulta.queixa, false)}>Adicionar à Queixa Principal</button>
                </div>
              )}
              {consulta.diagnostico && (
                <div className="border rounded-lg p-2 bg-blue-50">
                  <div className="text-xs font-semibold mb-1">Diagnóstico identificado</div>
                  <p className="text-sm whitespace-pre-wrap mb-1">{consulta.diagnostico}</p>
                  <button className="text-xs underline text-blue-700" onClick={() => onDiagnostico(consulta.diagnostico, false)}>Adicionar ao Diagnóstico</button>
                </div>
              )}
            </div>
          )}

          <div className="grid md:grid-cols-2 gap-2">
            {(consulta.topicos || []).map((t, i) => (
              <div key={i} className="border rounded-lg p-2 bg-white">
                <div className="text-sm font-semibold text-blue-900 mb-1">{t.titulo}</div>
                <ul className="list-disc ml-5 text-sm space-y-0.5">
                  {(t.itens || []).map((it, j) => <li key={j}>{it}</li>)}
                </ul>
              </div>
            ))}
          </div>

          <details className="text-sm">
            <summary className="cursor-pointer text-gray-600">Ver transcrição completa</summary>
            <textarea className="w-full border rounded-lg px-3 py-2 text-xs mt-1" rows={10} value={transcricao} onChange={e => setTranscricao(e.target.value)} />
          </details>
        </div>
      )}

      <ConfigGemini aberto={cfgAberto} onFechar={() => setCfgAberto(false)} cfg={cfg} onSalvar={salvarCfg} />
    </div>
  );
}


const ESTRUTURAS = [
  { key: "palpebras", label: "Pálpebras", normal: "sem alterações", explicacao: "Pálpebras protegem os olhos" },
  { key: "terceiraPalpebra", label: "3ª Pálpebra", normal: "sem alterações", explicacao: "Membrana de proteção adicional" },
  { key: "conjuntiva", label: "Conjuntiva", normal: "normocorada, sem secreção", explicacao: "Membrana que reveste o olho" },
  { key: "cornea", label: "Córnea", normal: "transparente, lisa, sem infiltrados", explicacao: "Parte transparente da frente do olho" },

const TRADUCOES_TUTOR = {
  "normocorada": "com cor saudável",
  "sem secreção": "limpa, sem secreção",
  "transparente": "cristalina e transparente",
  "lisa": "lisa e uniforme",
  "sem infiltrados": "sem manchas ou lesões",
  "profunda": "com profundidade normal",
  "límpida": "límpida e clara",
  "normoconformada": "com formato normal",
  "normorreagente": "reagindo normalmente à luz",
  "simétrica": "simétrica",
  "tópico": "na posição correta",
  "sem opacidades": "sem turvações",
  "vasos bem definidos": "vasos sanguíneos saudáveis",
  "sem hemorragias": "sem sangramentos",
  "normoconformado": "com aparência normal",
  "sem edema": "sem inchaço",
  "sem alterações": "sem alterações"
};
function traduzirTermo(texto) {
  let t = texto;
  Object.keys(TRADUCOES_TUTOR).forEach(k => {
    t = t.replace(new RegExp(k, "gi"), TRADUCOES_TUTOR[k]);
  });
  return t;
}

function fileToDataURL(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

/* Modal de estrutura ocular / exame complementar: texto + fotos */
function ExamModal({ isOpen, onClose, title, value, photos, onSave, allowPhotos }) {
  const [text, setText] = useState("");
  const [fotos, setFotos] = useState([]);

  useEffect(() => {
    if (isOpen) {
      setText(value || "");
      setFotos(photos || []);
    }
  }, [isOpen, value, photos]);

  if (!isOpen) return null;

  async function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    const urls = await Promise.all(files.map(fileToDataURL));
    setFotos(prev => [...prev, ...urls]);
  }

  function removeFoto(idx) {
    setFotos(prev => prev.filter((_, i) => i !== idx));
  }

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="p-4 border-b flex items-center justify-between bg-blue-50 sticky top-0">
          <h3 className="font-bold text-lg">{title}</h3>
          <button className="text-2xl w-8 h-8 rounded hover:bg-gray-100" onClick={onClose}>×</button>

          <textarea className="w-full min-h-[150px] px-3 py-2 rounded-xl border focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="Descreva as alterações encontradas (deixe em branco se normal)..." value={text} onChange={(e) => setText(e.target.value)} autoFocus />

          {allowPhotos && (
            <div className="mt-4">
              <label className="inline-block px-4 py-2 rounded-xl bg-purple-500 text-white text-sm cursor-pointer hover:bg-purple-600">
                📷 Anexar Fotos
                <input type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />
              </label>
              {fotos.length > 0 && (
                <div className="grid grid-cols-3 gap-2 mt-3">

function gerarReceita(tipo, medicamentos, patient, location) {
  const linhas = [];
  linhas.push("", "", "", "", "", "", "", "");
  linhas.push("RECEITUÁRIO");
  linhas.push("");
  linhas.push(`Data: ${location.data || new Date().toLocaleDateString('pt-BR')}`);
  linhas.push(`Paciente: ${patient.nome || "_______________________________"}`);
  linhas.push(`Tutor: ${patient.tutor || "_______________________________"}`);
  linhas.push("");
  linhas.push("");

  if (tipo === "oral") linhas.push("USO ORAL:");
  else if (tipo === "ambos") linhas.push("USO OFTÁLMICO (AMBOS OS OLHOS):");
  else if (tipo === "od") linhas.push("USO OFTÁLMICO (OLHO DIREITO):");
  else if (tipo === "oe") linhas.push("USO OFTÁLMICO (OLHO ESQUERDO):");
  linhas.push("");

  const meds = medicamentos.split('\n').filter(m => m.trim());

  meds.forEach((med, idx) => {
    let medicamento, frequencia, duracao;

    if (tipo !== "oral") {
      const percentIndex = med.indexOf('%');
      if (percentIndex === -1) {
        linhas.push(`${idx + 1}. ${med.trim()}`);
        linhas.push("");
        return;
      }
      medicamento = med.substring(0, percentIndex + 1).trim();
      let resto = med.substring(percentIndex + 1).trim();
      const partes = resto.split(/[\s,]+/).filter(p => p.trim());
      frequencia = partes[0] || "conforme orientação";
      duracao = partes[1] || "uso contínuo";
    } else {
      const partes = med.split(',').map(p => p.trim());
      if (partes.length < 4) {
        linhas.push(`${idx + 1}. ${med.trim()}`);
        linhas.push("");
        return;
      }
      medicamento = partes[0];
      frequencia = partes[2];
      duracao = partes[3];
    }

    medicamento = medicamento.charAt(0).toUpperCase() + medicamento.slice(1);

    if (tipo !== "oral" && !medicamento.toLowerCase().includes("colírio")) {
      const partesMed = medicamento.split(/\s+/);
      let inserido = false;
      for (let i = 0; i < partesMed.length; i++) {
        if (partesMed[i].match(/\d/) && partesMed[i].includes('%')) {
          partesMed.splice(i, 0, 'colírio');
          inserido = true;
          break;
        }
      }
      if (!inserido) partesMed.push('colírio');
      medicamento = partesMed.join(' ');
    }

    linhas.push(`${idx + 1}. ${medicamento} _________________________________ ${tipo === "oral" ? "1cx" : "1fco"}`);
    linhas.push("");

    let instrucao = "";
    if (tipo === "oral") {
      const partes = med.split(',').map(p => p.trim());
      let doseNumero = (partes[1] || "1").replace(/\s*comp(rimidos?)?/gi, '').trim();
      const doseCapitalizada = doseNumero.charAt(0).toUpperCase() + doseNumero.slice(1);
      const doseLower = doseNumero.toLowerCase();
      const textoComprimido = (doseLower.includes("meio") || doseLower === "0,5" || doseLower === "1/2" || doseLower === "1" || doseLower === "um" || doseLower === "uma") ? " comprimido" : " comprimidos";
      instrucao = `   Dê ${doseCapitalizada}${textoComprimido} por via oral`;
    } else if (tipo === "od") instrucao = "   Pingue uma gota no olho direito";
    else if (tipo === "oe") instrucao = "   Pingue uma gota no olho esquerdo";
    else if (tipo === "ambos") instrucao = "   Pingue uma gota em ambos os olhos";

    const freq = frequencia.toLowerCase().replace(/\s/g, '');
    let intervalo = "";
    if (freq.includes("1x") || freq === "sid" || freq === "q24h") intervalo = "a cada 24 horas";
    else if (freq.includes("2x") || freq === "bid" || freq === "q12h") intervalo = "a cada 12 horas";
    else if (freq.includes("3x") || freq === "tid" || freq === "q8h") intervalo = "a cada 8 horas";
    else if (freq.includes("4x") || freq === "qid" || freq === "q6h") intervalo = "a cada 6 horas";
    else if (freq.includes("5x")) intervalo = "5 vezes ao dia";
    else if (freq.includes("6x")) intervalo = "6 vezes ao dia";
    else intervalo = frequencia;

    instrucao += `, ${intervalo}`;

    let duracaoFormatada = duracao;
    if (duracao.match(/^\d+d$/i)) duracaoFormatada = `${duracao.match(/\d+/)[0]} dias`;

    instrucao += `, por ${duracaoFormatada}.`;
    linhas.push(instrucao);
    linhas.push("");
  });

  linhas.push("");
  linhas.push("");
  linhas.push("");
  linhas.push("_________________________________________________");
  linhas.push("Dr. Adélio Gurgel do Amaral Jr.");
  linhas.push("CRMV-SP 18.721");
  linhas.push("");
  linhas.push("");
  linhas.push("OBSERVAÇÕES IMPORTANTES:");
  linhas.push("");
  linhas.push("• Uso de colar protetor (elizabetano) é IMPRESCINDÍVEL durante todo o tratamento");
  linhas.push("• Realizar limpeza ocular com Soro Fisiológico quando observar secreção");
  linhas.push("• Em caso de piora ou emergência, contatar o HVA: (14) 3626-5287");

  return linhas.join('\n');
}

function ReceitaModal({ isOpen, onClose, patient, location, tratamentoOD, tratamentoOE, tratamentoOral }) {
  const [tipoReceita, setTipoReceita] = useState("oral");
  const [receitaEditavel, setReceitaEditavel] = useState("");

  function getReceitaAtual() {
    if (tipoReceita === "oral" && tratamentoOral.trim()) return gerarReceita("oral", tratamentoOral, patient, location);
    if (tipoReceita === "od" && tratamentoOD.trim()) return gerarReceita("od", tratamentoOD, patient, location);
    if (tipoReceita === "oe" && tratamentoOE.trim()) return gerarReceita("oe", tratamentoOE, patient, location);
    if (tipoReceita === "ambos") return gerarReceita("ambos", tratamentoOD, patient, location);
    return "Nenhum tratamento definido para esta opção.";
  }

  useEffect(() => { if (isOpen) setReceitaEditavel(getReceitaAtual()); }, [isOpen, tipoReceita]);

  if (!isOpen) return null;

  function imprimirReceita() {
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>Receituário</title><style>@page{size:A4;margin:3cm 2cm 2cm 2cm}body{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.6;color:#333;margin:0;padding:0}pre{font-family:'Segoe UI',Arial,sans-serif;white-space:pre-wrap;word-wrap:break-word;margin:0}</style></head><body><pre>${receitaEditavel}</pre></body></html>`);
    w.document.close();
    setTimeout(() => w.print(), 250);
  }

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full h-full flex flex-col" onClick={(e) => e.stopPropagation()}>
        <div className="p-4 border-b flex items-center justify-between bg-green-50">
          <h3 className="font-bold text-lg">📋 Receituário</h3>
          <button className="text-2xl w-8 h-8 rounded hover:bg-gray-100" onClick={onClose}>×</button>
        </div>
        <div className="p-4 border-b bg-gray-50 flex gap-3 justify-center flex-wrap">
          {[["oral", "Oral"], ["od", "OD"], ["oe", "OE"], ["ambos", "Ambos"]].map(([v, l]) => (
            <button key={v} className={`px-4 py-2 rounded-xl ${tipoReceita === v ? "bg-blue-500 text-white" : "bg-gray-200"}`} onClick={() => setTipoReceita(v)}>{l}</button>
          ))}
        </div>
        <div className="flex-1 overflow-y-auto p-6 bg-gray-50">
          <textarea className="w-full h-full min-h-full text-sm p-4 rounded-xl border bg-white" value={receitaEditavel} onChange={(e) => setReceitaEditavel(e.target.value)} style={{ fontFamily: "'Segoe UI', Arial, sans-serif", lineHeight: '1.8' }} />
        </div>
        <div className="p-4 border-t bg-gray-50 flex gap-3 justify-end">
          <button className="px-4 py-2 rounded-xl bg-blue-500 text-white hover:bg-blue-600" onClick={() => { navigator.clipboard.writeText(receitaEditavel); alert('Copiado!'); }}>📄 Copiar</button>
          <button className="px-4 py-2 rounded-xl bg-green-500 text-white hover:bg-green-600" onClick={imprimirReceita}>🖨 Imprimir</button>
        </div>
      </div>
    </div>
  );
}

      }
    });

    h += `</div>`;
    return h;
  }

  html += blocoOlho("Olho Direito (OD)", examsOD, examsOD.schirmer, examsOD.pio);

  `;
  return html;
}

function gerarRelatorioProntuario(patient, location, examsOD, examsOE, examesComplementares, diagnostico, consulta) {
  const linhas = [];
  linhas.push("RELATÓRIO - PRONTUÁRIO MÉDICO");
  linhas.push("");
  linhas.push(`Data: ${location.data || new Date().toLocaleDateString('pt-BR')}`);
  linhas.push(`Paciente: ${patient.nome || "_"}  |  Espécie/Raça: ${patient.especie || "_"}/${patient.raca || "_"}  |  Idade: ${patient.idade || "_"}`);
  linhas.push(`Tutor: ${patient.tutor || "_"}`);
  linhas.push("");
  linhas.push("ALTERAÇÕES ENCONTRADAS:");
  linhas.push("");

  let temAlteracao = false;

  function listarAlteracoes(label, exame, schirmer, pio) {
    let bloco = [];
    if (schirmer) {
      const r = interpretSchirmer(schirmer);
      if (r !== "Normal") bloco.push(`- Schirmer: ${schirmer} mm/min (${r})`);
    }
    if (pio) {
      const r = interpretPio(pio);
      if (r !== "Normal") bloco.push(`- PIO: ${pio} mmHg (${r})`);
    }
    ESTRUTURAS.forEach(est => {
      const v = exame[est.key];
      if (v && v.trim()) bloco.push(`- ${est.label}: ${v.trim()}`);
    });
    TESTES_CORNEA.forEach(t => {
      const v = exame[t.key];
      if (v && v.trim()) bloco.push(`- ${t.label}: ${v.trim()}`);
    });
    if (bloco.length > 0) {
      temAlteracao = true;
      linhas.push(`${label}:`);
      linhas.push(...bloco);
      linhas.push("");
    }
  }

  listarAlteracoes("OD", examsOD, examsOD.schirmer, examsOD.pio);
  listarAlteracoes("OE", examsOE, examsOE.schirmer, examsOE.pio);

  EXAMES_COMPLEMENTARES.forEach(ex => {
    const v = examesComplementares[ex.key];
    if (v && v.trim()) {
      temAlteracao = true;
      linhas.push(`${ex.label}: ${v.trim()}`);
      linhas.push("");
    }
  });

  if (!temAlteracao) {
    linhas.push("Nenhuma alteração encontrada.");
    linhas.push("");
  }

  linhas.push("DIAGNÓSTICO:");
  linhas.push(diagnostico.trim() || "_");
  linhas.push("");
  if (consulta && (consulta.resumo || (consulta.topicos || []).length)) {
    linhas.push("RESUMO DA CONSULTA (gravação):");
    if (consulta.resumo) { linhas.push(consulta.resumo.trim()); linhas.push(""); }
    (consulta.topicos || []).forEach(tp => {
      linhas.push(`${tp.titulo}:`);
      (tp.itens || []).forEach(it => linhas.push(`- ${it}`));
      linhas.push("");
    });
  }
  linhas.push("_________________________________________________");
  linhas.push("Dr. Adélio Gurgel do Amaral Jr. - CRMV-SP 18.721");

  return linhas.join('\n');
}

/* ===================== ARMAZENAMENTO LOCAL DAS FICHAS (IndexedDB) ===================== */
/* Para trocar por Firebase depois, basta reescrever estas 4 funções: listar, obter, salvar, excluir. */

const Fichas = {
  _db: null,
  _abrir() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("Este navegador não permite guardar fichas."));
      const req = indexedDB.open("hva_oftalmovet", 1);
      req.onupgradeneeded = () => { req.result.createObjectStore("fichas", { keyPath: "id" }); };
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error || new Error("Falha ao abrir o armazenamento."));
    });
  },
  async _tx(modo, fn) {
    const db = await this._abrir();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("fichas", modo);
      const r = fn(tx.objectStore("fichas"));
      tx.oncomplete = () => resolve(r && r.result);
      tx.onerror = () => reject(tx.error || new Error("Falha ao gravar."));
      tx.onabort = () => reject(tx.error || new Error("Operação cancelada (talvez sem espaço no aparelho)."));
    });
  },
  async listar() { return (await this._tx("readonly", st => st.getAll())) || []; },
  obter(id) { return this._tx("readonly", st => st.get(id)); },
  salvar(ficha) { return this._tx("readwrite", st => st.put(ficha)); },
  excluir(id) { return this._tx("readwrite", st => st.delete(id)); },
};

function hojeISO() { return new Date().toLocaleDateString("en-CA"); }
function fmtData(iso) {
  const p = String(iso || "").split("-");
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : (iso || "sem data");
}
function norm(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
}
function novoId() {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function BuscaFichasModal({ aberto, onFechar, onAbrir, onRetorno, onExcluida, onAviso }) {
  const [fichas, setFichas] = useState([]);
  const [q, setQ] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState("");

  async function recarregar() {
    setCarregando(true); setErro("");
    try { setFichas(await Fichas.listar()); }
    catch (e) { setErro(e.message); }
    finally { setCarregando(false); }
  }
  useEffect(() => { if (aberto) { setQ(""); recarregar(); } }, [aberto]);
  if (!aberto) return null;

  const termos = norm(q).split(/\s+/).filter(Boolean);
  const lista = fichas
    .map(f => {
      const p = f.paciente || {};
      const ats = f.atendimentos || [];
      const texto = norm([p.nome, p.tutor, p.especie, p.raca,
        ...ats.map(a => [a.patient && [a.patient.nome, a.patient.tutor, a.patient.especie, a.patient.raca].join(" "), a.diagnostico, a.chiefComplaint, a.location && a.location.tipoConsulta, a.consulta && a.consulta.resumo, fmtData(a.data)].join(" "))].join(" "));
      return { f, texto };
    })
    .filter(x => termos.every(t => x.texto.includes(t)))
    .sort((a, b) => (b.f.atualizadoEm || 0) - (a.f.atualizadoEm || 0))
    .map(x => x.f);

  async function excluir(f) {
    if (!window.confirm(`Excluir a ficha de ${f.paciente.nome || "sem nome"} com TODOS os ${f.atendimentos.length} atendimento(s)? Isso não pode ser desfeito.`)) return;
    try { await Fichas.excluir(f.id); onExcluida(f.id); await recarregar(); onAviso("Ficha excluída."); }
    catch (e) { setErro(e.message); }
  }

  async function backup() {
    try {
      const todas = await Fichas.listar();
      const blob = new Blob([JSON.stringify({ app: "oftalmovet-hva", versao: 1, exportadoEm: new Date().toISOString(), fichas: todas })], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `fichas-oftalmovet-${hojeISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) { setErro(e.message); }
  }

  async function restaurar(e) {
    const arq = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!arq) return;
    try {
      const dados = JSON.parse(await arq.text());
      const novas = Array.isArray(dados) ? dados : dados.fichas;
      if (!Array.isArray(novas) || !novas.every(f => f && f.id && f.paciente && Array.isArray(f.atendimentos))) throw new Error("Este arquivo não parece um backup das fichas.");
      if (!window.confirm(`Restaurar ${novas.length} ficha(s) do backup? Fichas com o mesmo código serão atualizadas só se o backup for mais recente.`)) return;
      const atuais = await Fichas.listar();
      let n = 0;
      for (const f of novas) {
        const existente = atuais.find(x => x.id === f.id);
        if (!existente || (f.atualizadoEm || 0) >= (existente.atualizadoEm || 0)) { await Fichas.salvar(f); n++; }
      }
      await recarregar();
      onAviso(`Backup restaurado: ${n} ficha(s).`);
    } catch (err) { setErro(err.message); }
  }

  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-3 overflow-y-auto">
      <div className="bg-white rounded-2xl p-4 w-full max-w-2xl my-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-lg">🔍 Fichas salvas</h3>
          <button className="text-2xl leading-none px-2" onClick={onFechar} aria-label="Fechar">×</button>
        </div>
        <input autoFocus className="w-full border rounded-xl px-3 py-2 mb-2 text-sm" placeholder="Buscar por paciente, tutor, espécie, raça, diagnóstico, data (11/10/2026)…" value={q} onChange={e => setQ(e.target.value)} />
        <div className="flex flex-wrap items-center gap-2 mb-3 text-xs text-gray-600">
          <span>{carregando ? "Carregando…" : `${lista.length} de ${fichas.length} ficha(s)`}</span>
          <span className="flex-1" />
          <button className="px-2 py-1 rounded-lg bg-gray-100 border" onClick={backup}>⬇️ Backup</button>
          <label className="px-2 py-1 rounded-lg bg-gray-100 border cursor-pointer">⬆️ Restaurar<input type="file" accept="application/json,.json" className="hidden" onChange={restaurar} /></label>
        </div>
        {erro && <p className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-2 mb-2">{erro}</p>}
        {!carregando && fichas.length === 0 && !erro && <p className="text-sm text-gray-500 py-6 text-center">Nenhuma ficha salva ainda. Preencha uma ficha e toque em 💾 Salvar.</p>}
        {!carregando && fichas.length > 0 && lista.length === 0 && <p className="text-sm text-gray-500 py-6 text-center">Nada encontrado para essa busca.</p>}
        <div className="space-y-2">
          {lista.map(f => {
            const ats = [...(f.atendimentos || [])].reverse();
            const ultimo = ats[0] || {};
            return (
              <div key={f.id} className="border rounded-xl p-3">
                <div className="flex flex-wrap items-start justify-between gap-2">
                  <div>
                    <div className="font-semibold text-blue-900">{f.paciente.nome || "Sem nome"} <span className="font-normal text-gray-600 text-sm">{[f.paciente.especie, f.paciente.raca].filter(Boolean).join(" · ")}</span></div>
                    <div className="text-xs text-gray-600">Tutor: {f.paciente.tutor || "—"} · {ats.length} atendimento(s) · último em {fmtData(ultimo.data)}</div>
                    {ultimo.diagnostico && <div className="text-xs text-gray-700 mt-1 line-clamp-2">Dx: {ultimo.diagnostico}</div>}
                  </div>
                  <div className="flex gap-1">
                    <button className="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs" onClick={() => onAbrir(f, ultimo.id)}>Abrir</button>
                    <button className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs" onClick={() => onRetorno(f)}>➕ Retorno</button>
                    <button className="px-2 py-1.5 rounded-lg bg-gray-100 border text-xs" onClick={() => excluir(f)} aria-label="Excluir ficha">🗑️</button>
                  </div>
                </div>
                <div className="flex flex-wrap gap-1 mt-2">
                  {ats.map(a => (
                    <button key={a.id} className="px-2 py-0.5 rounded-full bg-gray-100 border text-xs hover:bg-blue-50" onClick={() => onAbrir(f, a.id)}>{fmtData(a.data)}{a.location && a.location.tipoConsulta ? ` · ${a.location.tipoConsulta}` : ""}</button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

  const [tratamentoOD, setTratamentoOD] = useState("");
  const [tratamentoOE, setTratamentoOE] = useState("");

  const [diagnostico, setDiagnostico] = useState("");
  const [consulta, setConsulta] = useState(null);

  /* ---------- fichas salvas ---------- */
  const [fichaId, setFichaId] = useState(null);
  const [atendId, setAtendId] = useState(null);
  const [fichaAtual, setFichaAtual] = useState(null);
  const [formKey, setFormKey] = useState(0);
  const [sujo, setSujo] = useState(false);
  const [buscaAberta, setBuscaAberta] = useState(false);
  const [aviso, setAviso] = useState(null);
  const [gravandoAgora, setGravandoAgora] = useState(false);
  const snapshotRef = useRef(null);
  const avisoTimer = useRef(null);

  function montarDados() {
    return { patient, location, chiefComplaint, examsOD, examsOE, examesComplementares, tratamentoOral, tratamentoOD, tratamentoOE, diagnostico, consulta };
  }
  const montarRef = useRef(montarDados);
  montarRef.current = montarDados;
  const estaSujo = () => JSON.stringify(montarRef.current()) !== snapshotRef.current;

  function mostrarAviso(texto, erro) {
    setAviso({ texto, erro: !!erro });
    clearTimeout(avisoTimer.current);
    avisoTimer.current = setTimeout(() => setAviso(null), 3500);
  }

  useEffect(() => {
    snapshotRef.current = JSON.stringify(montarRef.current());
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    const h = (e) => { if (estaSujo()) { e.preventDefault(); e.returnValue = ""; } };
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, []);

  useEffect(() => {
    const timer = setTimeout(() => {
      if (snapshotRef.current === null) snapshotRef.current = JSON.stringify(montarRef.current());
      setSujo(estaSujo());
    }, 500);
    return () => clearTimeout(timer);
  }, [patient, location, chiefComplaint, examsOD, examsOE, examesComplementares, tratamentoOral, tratamentoOD, tratamentoOE, diagnostico, consulta]);

  function aplicar(d, novoFichaId, novoAtendId, ficha) {
    const dados = {
      patient: { nome: '', especie: '', raca: '', sexo: '', idade: '', tutor: '', ...(d.patient || {}) },
      location: { data: hojeISO(), tipoConsulta: '', ...(d.location || {}) },
      chiefComplaint: d.chiefComplaint || "",
      examsOD: d.examsOD || {},
      examsOE: d.examsOE || {},
      examesComplementares: d.examesComplementares || {},
      tratamentoOral: d.tratamentoOral || "",
      tratamentoOD: d.tratamentoOD || "",
      tratamentoOE: d.tratamentoOE || "",
      diagnostico: d.diagnostico || "",
      consulta: d.consulta || null,
    };
    snapshotRef.current = JSON.stringify(dados);
    gravarLS(RASCUNHO_KEY, "");
    setPatient(dados.patient); setLocation(dados.location); setChiefComplaint(dados.chiefComplaint);
    setExamsOD(dados.examsOD); setExamsOE(dados.examsOE); setExamesComplementares(dados.examesComplementares);
    setTratamentoOral(dados.tratamentoOral); setTratamentoOD(dados.tratamentoOD); setTratamentoOE(dados.tratamentoOE);
    setDiagnostico(dados.diagnostico); setConsulta(dados.consulta);
    setFichaId(novoFichaId); setAtendId(novoAtendId); setFichaAtual(ficha || null);
    setSujo(false);
    setFormKey(k => k + 1);
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  async function salvar() {
    if (!patient.nome.trim()) { mostrarAviso("⚠️ Preencha o nome do paciente para salvar.", true); return false; }
    try {
      let ficha = fichaId ? await Fichas.obter(fichaId) : null;
      if (!ficha) {
        const todas = await Fichas.listar();
        const dup = todas.find(f => norm(f.paciente && f.paciente.nome) === norm(patient.nome) && norm(f.paciente && f.paciente.tutor) === norm(patient.tutor));
        if (dup && window.confirm(`Já existe uma ficha de ${dup.paciente.nome}${dup.paciente.tutor ? " (tutor: " + dup.paciente.tutor + ")" : ""}, com ${dup.atendimentos.length} atendimento(s).\n\nOK = adicionar este atendimento à ficha existente\nCancelar = criar uma ficha nova separada`)) ficha = dup;
        else ficha = { id: novoId(), criadoEm: Date.now(), atendimentos: [] };
      }
      const loc = { ...location, data: location.data || hojeISO() };
      if (!location.data) setLocation(loc);
      const dados = { ...montarDados(), location: loc };
      const id = atendId || novoId();
      const reg = { id, data: loc.data, ...dados };
      const i = ficha.atendimentos.findIndex(a => a.id === id);
      if (i >= 0) ficha.atendimentos[i] = reg; else ficha.atendimentos.push(reg);
      ficha.atendimentos.sort((a, b) => String(a.data).localeCompare(String(b.data)));
      if (ficha.atendimentos[ficha.atendimentos.length - 1].id === id || !ficha.paciente) ficha.paciente = { ...patient };
      ficha.atualizadoEm = Date.now();
      await Fichas.salvar(ficha);
      snapshotRef.current = JSON.stringify(dados);
      setFichaId(ficha.id); setAtendId(id); setFichaAtual(ficha); setSujo(false);
      mostrarAviso(`✅ Salvo neste aparelho (${ficha.atendimentos.length} atendimento${ficha.atendimentos.length > 1 ? "s" : ""} na ficha).`);
      return true;
    } catch (e) {
      mostrarAviso("❌ Não consegui salvar: " + e.message, true);
      return false;
    }
  }

  async function confirmarSaida() {
    if (gravandoAgora) { window.alert("Há uma gravação em andamento. Termine a gravação antes de trocar de ficha."); return false; }
    if (!estaSujo()) return true;
    if (window.confirm("Há alterações não salvas.\n\nOK = salvar e continuar\nCancelar = não salvar")) return await salvar();
    return window.confirm("Continuar SEM salvar? As alterações desta ficha serão perdidas.");
  }

  async function novaConsulta() {
    if (!(await confirmarSaida())) return;
    aplicar({}, null, null, null);
  }

  function abrirRetorno(ficha) {
    aplicar({ patient: ficha.paciente, location: { data: hojeISO(), tipoConsulta: "Retorno" } }, ficha.id, null, ficha);
    mostrarAviso("Novo atendimento criado nesta ficha. Preencha e toque em 💾 Salvar.");
  }

  async function abrirFicha(ficha, idAtend) {
    if (!(await confirmarSaida())) return;
    const f = (await Fichas.obter(ficha.id)) || ficha;
    const at = f.atendimentos.find(a => a.id === idAtend) || f.atendimentos[f.atendimentos.length - 1];
    if (!at) return;
    aplicar({ ...at, patient: at.patient || f.paciente }, f.id, at.id, f);
    setBuscaAberta(false);
  }

  async function novoRetornoDe(ficha) {
    if (!(await confirmarSaida())) return;
    const f = (await Fichas.obter(ficha.id)) || ficha;
    abrirRetorno(f);
    setBuscaAberta(false);
  }

  function fichaExcluida(id) {
    if (id === fichaId) { setFichaId(null); setAtendId(null); setFichaAtual(null); snapshotRef.current = ""; setSujo(true); }
  }

  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
      <div className="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-6">

        <div className="flex items-start justify-between mb-6 flex-wrap gap-2">
          <h1 className="text-xl md:text-2xl font-bold text-blue-900">Serviço de Oftalmologia Veterinária - HVA</h1>
          <div className="text-right text-sm">
            <div className="italic text-gray-700">Dr. Adélio Gurgel do Amaral Jr.</div>
            <div className="italic text-gray-600 text-xs">CRMV-SP 18.721</div>
          </div>
        </div>

        <div className="sticky top-0 z-30 -mx-2 px-2 py-2 mb-4 bg-white/95 backdrop-blur border-b flex flex-wrap items-center gap-2">
          <button className="px-4 py-2 rounded-xl bg-green-600 text-white text-sm font-semibold hover:bg-green-700" onClick={salvar}>💾 Salvar</button>
          <button className="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700" onClick={novaConsulta}>➕ Nova consulta</button>
          <button className="px-4 py-2 rounded-xl bg-gray-100 border text-sm font-semibold hover:bg-gray-200" onClick={() => setBuscaAberta(true)}>🔍 Buscar fichas</button>
          <span className={`text-xs ${sujo ? "text-amber-600" : "text-green-700"}`}>
            {sujo ? (fichaId ? "● alterações não salvas" : "● ficha nova, ainda não salva") : (fichaId ? "✓ salva" : "")}
          </span>
        </div>

        {fichaId && fichaAtual && (
          <div className="mb-4 p-3 rounded-xl bg-indigo-50 border border-indigo-200 flex flex-wrap items-center gap-2 text-sm">
            <span className="font-semibold">📁 Ficha de {fichaAtual.paciente.nome}</span>
            <span className="text-gray-600">{fichaAtual.atendimentos.length} atendimento(s)</span>
            <select className="border rounded-lg px-2 py-1 bg-white" value={atendId || ""} onChange={e => abrirFicha(fichaAtual, e.target.value)}>
              {!atendId && <option value="">(novo atendimento — não salvo)</option>}
              {[...fichaAtual.atendimentos].reverse().map(a => (
                <option key={a.id} value={a.id}>{fmtData(a.data)}{a.location && a.location.tipoConsulta ? " — " + a.location.tipoConsulta : ""}</option>
              ))}
            </select>
            <button className="px-3 py-1 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700" onClick={() => novoRetornoDe(fichaAtual)}>➕ Novo atendimento (retorno)</button>
          </div>
        )}

        <div key={formKey}>

        <Section title="Identificação do Paciente">
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            <Field label="Nome do Paciente" value={patient.nome} onChange={(v) => setPatient(p => ({ ...p, nome: v }))} />
            <Field label="Tutor" value={patient.tutor} onChange={(v) => setPatient(p => ({ ...p, tutor: v }))} />
            <Field label="Espécie" value={patient.especie} onChange={(v) => setPatient(p => ({ ...p, especie: v }))} />
            <Field label="Raça" value={patient.raca} onChange={(v) => setPatient(p => ({ ...p, raca: v }))} />
            <Field label="Sexo" value={patient.sexo} onChange={(v) => setPatient(p => ({ ...p, sexo: v }))} />
            <Field label="Idade" value={patient.idade} onChange={(v) => setPatient(p => ({ ...p, idade: v }))} />
            <Field label="Data" type="date" value={location.data} onChange={(v) => setLocation(p => ({ ...p, data: v }))} />
            <Field label="Tipo de Consulta" value={location.tipoConsulta} onChange={(v) => setLocation(p => ({ ...p, tipoConsulta: v }))} placeholder="Consulta, Retorno..." />
          </div>
        </Section>

        <Section title="🎙️ Gravação e Resumo da Consulta">
          <GravadorConsulta
            patient={patient}
            consulta={consulta}
            setConsulta={setConsulta}
            chiefComplaint={chiefComplaint}
            diagnostico={diagnostico}
            onQueixa={(texto) => setChiefComplaint(prev => prev && prev.trim() ? `${prev}\n${texto}` : texto)}
            onDiagnostico={(texto) => setDiagnostico(prev => prev && prev.trim() ? `${prev}\n${texto}` : texto)}
            onGravando={setGravandoAgora}
            permitirRascunho={!fichaId}
          />
        </Section>

        <Section title="Queixa Principal">
          <div className="w-full px-3 py-3 rounded-xl border bg-white cursor-pointer hover:bg-blue-50 min-h-[70px] flex items-center" onClick={() => setQueixaModalOpen(true)}>
            {chiefComplaint ? <p className="text-sm whitespace-pre-wrap">{chiefComplaint}</p> : <p className="text-sm text-gray-400">Clique para adicionar a queixa principal...</p>}
          </div>
        </Section>

        <Section title="Exame Oftalmológico">
          <div className="grid md:grid-cols-2 gap-4">
            <OlhoExame ladoLabel="Olho Direito (OD)" exame={examsOD} setExame={setExamsOD}
              schirmer={examsOD.schirmer || ""} setSchirmer={(v) => setExamsOD(p => ({ ...p, schirmer: v }))}
              pio={examsOD.pio || ""} setPio={(v) => setExamsOD(p => ({ ...p, pio: v }))} />
            <OlhoExame ladoLabel="Olho Esquerdo (OE)" exame={examsOE} setExame={setExamsOE}
              schirmer={examsOE.schirmer || ""} setSchirmer={(v) => setExamsOE(p => ({ ...p, schirmer: v }))}
              pio={examsOE.pio || ""} setPio={(v) => setExamsOE(p => ({ ...p, pio: v }))} />
          </div>
        </Section>

        <Section title="Exames Complementares">
          <ExamesComplementares dados={examesComplementares} setDados={setExamesComplementares} />
        </Section>

        <Section title="Tratamento">
          <div className="space-y-3">
            <div>
              <label className="block text-sm font-medium mb-1">Tratamento Oral</label>
              <textarea className="w-full px-3 py-2 rounded-xl border text-sm" rows="2" placeholder="Ex: Cefalexina comp 500mg, 1, bid, 10d" value={tratamentoOral} onChange={(e) => setTratamentoOral(e.target.value)} />
              <small className="text-gray-500 block mt-1">medicamento, quantidade, frequência, duração</small>
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Tratamento OD</label>
              <textarea className="w-full px-3 py-2 rounded-xl border text-sm" rows="2" placeholder="Ex: Tobramicina 0,3% bid 10d" value={tratamentoOD} onChange={(e) => setTratamentoOD(e.target.value)} />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Tratamento OE</label>
              <textarea className="w-full px-3 py-2 rounded-xl border text-sm" rows="2" placeholder="Ex: Tobramicina 0,3% bid 10d" value={tratamentoOE} onChange={(e) => setTratamentoOE(e.target.value)} />
              <small className="text-gray-500 block mt-1">medicamento concentração% frequência duração</small>
            </div>
          </div>
        </Section>

        <Section title="Diagnóstico">
          <div className="w-full px-3 py-3 rounded-xl border bg-white cursor-pointer hover:bg-blue-50 min-h-[70px] flex items-center" onClick={() => setDiagnosticoModalOpen(true)}>
            {diagnostico ? <p className="text-sm whitespace-pre-wrap">{diagnostico}</p> : <p className="text-sm text-gray-400">Clique para adicionar o diagnóstico...</p>}
          </div>
        </Section>

        <div className="flex flex-wrap gap-3 justify-center pt-2">
          <button className="px-5 py-3 rounded-xl bg-green-600 text-white font-medium hover:bg-green-700 shadow-lg" onClick={() => setReceitaModalOpen(true)}>📋 Gerar Receituário</button>
          <button className="px-5 py-3 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 shadow-lg" onClick={() => setRelatorioTutorOpen(true)}>📄 Relatório Tutor</button>
          <button className="px-5 py-3 rounded-xl bg-indigo-700 text-white font-medium hover:bg-indigo-800 shadow-lg" onClick={() => setRelatorioProntuarioOpen(true)}>📋 Relatório Prontuário</button>
        </div>
        </div>
      </div>

      <TextModal isOpen={queixaModalOpen} onClose={() => setQueixaModalOpen(false)} title="Queixa Principal" value={chiefComplaint} onSave={setChiefComplaint} />
      <TextModal isOpen={diagnosticoModalOpen} onClose={() => setDiagnosticoModalOpen(false)} title="Diagnóstico" value={diagnostico} onSave={setDiagnostico} />

      <ReceitaModal isOpen={receitaModalOpen} onClose={() => setReceitaModalOpen(false)} patient={patient} location={location} tratamentoOD={tratamentoOD} tratamentoOE={tratamentoOE} tratamentoOral={tratamentoOral} />

      <RelatorioModal
        isOpen={relatorioTutorOpen}
        onClose={() => setRelatorioTutorOpen(false)}
        title="📄 Relatório para o Tutor"
        content={gerarRelatorioTutorHTML(patient, location, examsOD, examsOE, diagnostico)}
        isHTML={true}
      />

      <RelatorioModal
        isOpen={relatorioProntuarioOpen}
        onClose={() => setRelatorioProntuarioOpen(false)}
        title="📋 Relatório para Prontuário Médico"
        content={gerarRelatorioProntuario(patient, location, examsOD, examsOE, examesComplementares, diagnostico, consulta)}
        isHTML={false}
      />

      <BuscaFichasModal
        aberto={buscaAberta}
        onFechar={() => setBuscaAberta(false)}
        onAbrir={abrirFicha}
        onRetorno={novoRetornoDe}
        onExcluida={fichaExcluida}
        onAviso={(m) => mostrarAviso(m)}
      />

      {aviso && (
        <div className={`fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-xl text-sm shadow-lg text-white max-w-[92vw] ${aviso.erro ? "bg-red-600" : "bg-gray-900"}`}>{aviso.texto}</div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<OphthoVetApp />);
</script>
</body>
</html>
